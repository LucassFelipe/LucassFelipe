name: Generate Snake

on:
  schedule:
    # 03:00 UTC = 00:00 em UTC-3 (horário local)
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # A API de contribuições agrupa os dias no fuso do dono do token.
          # O token padrão do Actions pertence ao github-actions[bot] (UTC),
          # então usamos um PAT da própria conta (UTC-3) quando disponível.
          # Sem o segredo, o workflow continua funcionando no modo antigo (UTC).
          github_token: ${{ secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
